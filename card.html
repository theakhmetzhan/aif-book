<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVIDENCE · Book Presentation Card (dev)</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500&family=Playfair+Display:wght@400;700&family=Space+Grotesk:wght@500;600&family=Special+Elite&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0a09; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; box-shadow: 0 10px 50px rgba(0,0,0,.6); }
</style>
</head>
<body>
<!-- Dev-only: renders the 16:9 exhibition card. ?scale=2 → 3840×2160, ?w=2048&h=1152 any size. Export: node scripts/export-card.mjs -->
<script type="module">
import { makeCardCanvas } from '/src/card.js';
const q = new URLSearchParams(location.search), scale = Math.max(0.25, +(q.get('scale') || 1));
const c = await makeCardCanvas(+q.get('w') || Math.round(1920 * scale), +q.get('h') || Math.round(1080 * scale)); // ?w=2048&h=1152 for the board print
c.id = 'card'; document.body.append(c);
window.cardInfo = c.info; console.log('card', c.width, c.height, c.info);
document.body.dataset.ready = 1;
</script>
</body>
</html>
